<!DOCTYPE html>

<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доступные поездки | TravelBuddy</title>

    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Добавляем эстетичное фото дороги на фон с мягким наложением цвета */
            background: linear-gradient(rgba(245, 247, 250, 0.85), rgba(228, 232, 240, 0.85)),
            url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }
        .navbar-custom {
            background-color: rgba(30, 30, 36, 0.95);
            backdrop-filter: blur(10px); /* Эффект размытия стекла */
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .trip-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            border-radius: 18px; /* Делаем углы карточек более мягкими и круглыми */
            box-shadow: 0 8px 24px rgba(149, 157, 165, 0.12);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .trip-card:hover {
            transform: translateY(-5px); /* Плавное всплытие карточки при наведении */
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.15);
            background: #ffffff;
        }
        .btn-custom-success {
            background-color: #6366f1; /* Переходим на нежный индиго */
            color: #ffffff;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 500;
            border: none;
            transition: all 0.2s ease;
        }
        .btn-custom-success:hover {
            background-color: #4f46e5;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .btn-outline-custom {
            border: 2px solid #1e1e24;
            color: #1e1e24;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-outline-custom:hover {
            background-color: #1e1e24;
            color: #ffffff;
        }
        .badge-seats {
            background-color: rgba(99, 102, 241, 0.1);
            color: #6366f1;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
        }
    </style>

</head>
<body class="bg-light">


<nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/trips">🚗 TravelBuddy</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="/logout">Выйти</a>
        </div>
    </div>
</nav>


<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 text-secondary fw-bold">Изучайте новые маршруты</h1>
        <a href="/trips/create" class="btn btn-custom-success">+ Создать поездку</a>
    </div>


    <div class="row">


        <div class="col-md-4 mb-4" th:each="trip : ${tripsAttribute}">


            <div class="card trip-card h-100 shadow-sm border-0">
                <div class="card-body">

                    <h5 class="card-title fw-bold text-primary">
                        <span th:text="${trip.fromPlace}">Откуда</span> →
                        <span th:text="${trip.toPlace}">Куда</span>
                    </h5>


                    <p class="card-text text-muted my-3" th:text="${trip.description}">Описание поездки отсутствует.</p>

                    <hr>


                    <div class="small text-secondary">

                        <div class="mb-1">📅 Дата: <span th:text="${trip.departureDate}">01.01.2026</span></div>

                        <div>👥 Свободно мест: <span class="badge bg-info text-dark" th:text="${trip.availableSeats}">0</span> из <span th:text="${trip.totalSeats}">0</span></div>
                    </div>
                </div>


                <div class="card-footer bg-transparent border-top-0 pb-3">
                    <a href="#" class="btn btn-outline-custom w-100 btn-sm w-100 btn-sm fw-bold">Хочу поехать</a>
                </div>
            </div>

        </div>


        <div class="col-12 text-center my-5" th:if="${#lists.isEmpty(tripsAttribute)}">
            <p class="lead text-muted">Пока никто не создал ни одной поездки. Будьте первыми!</p>
        </div>

    </div>
</div>

</body>
</html>
