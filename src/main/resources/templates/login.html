<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | TravelBuddy</title>

    <link href="https://jsdelivr.net" rel="stylesheet">

    <link href="https://googleapis.com" rel="stylesheet">


    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(160, 175, 195, 0.15);
            border: none;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .btn-custom {
            background-color: #1e1e24;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-custom:hover {
            background-color: #2d2d35;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .brand-logo {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1e1e24;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 440px;">
    <div class="text-center mb-4">
        <h2 class="brand-logo mb-1">🚗 TravelBuddy</h2>
        <p class="text-muted small">Вход в личный кабинет</p>
    </div>

    <div class="card login-card p-4 p-sm-5">
        <h4 class="fw-bold text-center mb-4" style="color: #2d3748;">Авторизация</h4>


        <div th:if="${param.error}" class="alert alert-danger small p-2 text-center rounded-3 mb-3">
            Неверный email или пароль
        </div>


        <div th:if="${param.logout}" class="alert alert-success small p-2 text-center rounded-3 mb-3">
            Вы успешно вышли из системы
        </div>


        <form th:action="@{/login}" method="post">

            <!-- Поле: Email (Логин) -->
            <div class="mb-3">
                <label class="form-label small text-secondary fw-medium">Электронная почта</label>
                <!--  name="username" -->
                <input type="email" name="username" class="form-control" placeholder="name@example.com" required>
            </div>

            <!-- Поле: Пароль -->
            <div class="mb-4">
                <label class="form-label small text-secondary fw-medium">Пароль</label>
                <!-- Важно: name="password" -->
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <!-- Кнопка авторизации -->
            <button type="submit" class="btn btn-custom w-100 mb-3">Войти</button>

            <div class="text-center mt-3">
                <span class="small text-muted">Ещё нет аккаунта? </span>
                <a th:href="@{/register}" class="small fw-semibold text-decoration-none" style="color: #6366f1;">Создать аккаунт</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
