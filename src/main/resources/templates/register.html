<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создать аккаунт | TravelBuddy</title>

    <link href="https://jsdelivr.net" rel="stylesheet">

    <link href="https://googleapis.com" rel="stylesheet">


    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
        }
        .register-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(160, 175, 195, 0.15);
            border: none;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }
        .btn-custom {
            background-color: #1e1e24;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-custom:hover {
            background-color: #2d2d35;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .brand-logo {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1e1e24;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">

<div class="container" style="max-width: 480px;">
    <div class="text-center mb-4">
        <h2 class="brand-logo mb-1">🚗 TravelBuddy</h2>
        <p class="text-muted small">Найди свою компанию для идеального трипа</p>
    </div>


    <div class="card register-card p-4 p-sm-5">
        <h4 class="fw-bold text-center mb-4" style="color: #2d3748;">Регистрация</h4>


        <form th:action="@{/register}" th:object="${userAttribute}" method="post">


            <div class="mb-3">
                <label class="form-label small text-secondary fw-medium">Имя и Фамилия</label>
                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Иван Иванов" required>
            </div>


            <div class="mb-3">
                <label class="form-label small text-secondary fw-medium">Электронная почта</label>
                <input type="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required>
            </div>

            <!-- Поле: Пароль -->
            <div class="mb-3">
                <label class="form-label small text-secondary fw-medium">Пароль</label>
                <input type="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>

            <!-- Поле: Возраст -->
            <div class="mb-3">
                <label class="form-label small text-secondary fw-medium">Возраст</label>
                <input type="number" th:field="*{age}" class="form-control" placeholder="20" min="18" max="100" required>
            </div>

            <!-- Поле: Контакты -->
            <div class="mb-4">
                <label class="form-label small text-secondary fw-medium">Ссылка на Telegram / Телефон</label>
                <input type="text" th:field="*{contactInfo}" class="form-control" placeholder="@telegram_username" required>
            </div>

            <!-- Кнопка отправки формы -->
            <button type="submit" class="btn btn-custom w-100 mb-3">Создать аккаунт</button>

            <div class="text-center mt-3">
                <span class="small text-muted">Уже есть аккаунт? </span>
                <a th:href="@{/login}" class="small fw-semibold text-decoration-none" style="color: #6366f1;">Войти</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
